---
layout: default
---

<article class="post{% if page.class %} {{ page.class }}{% endif %}">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  {% unless page.hide_date %}
  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>
  {% endunless %}
</article>
